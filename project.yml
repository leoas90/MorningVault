name: MorningVault
options:
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MeetingNotesKit:
    path: Packages/MeetingNotesKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    APP_SHORTCUTS_ENABLE_FLEXIBLE_MATCHING: NO
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "8ZPN58AQLD"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"
    PROVISIONING_PROFILE_SPECIFIER: "MorningVaultAppStores"
  configs:
    Debug:
      # Unoptimized Debug so SwiftUI previews (Xcode MCP RenderPreview) can render.
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_TESTABILITY: YES
      # Simulator/preview builds for the host arch only (packages build arm64 only).
      ONLY_ACTIVE_ARCH: YES

targets:
  MorningVault:
    type: application
    platform: iOS
    sources:
      - path: MorningVault
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeziddr.morningvault.dev
        PRODUCT_NAME: MorningVault
        INFOPLIST_KEY_CFBundleDisplayName: MorningVault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 30
        MARKETING_VERSION: 1.0.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MorningVault/Info.plist
        ALWAYS_SEARCH_USER_PATHS: NO
    entitlements:
      path: MorningVault/MorningVault.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.weatherkit: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.yeziddr.morningvault
        com.apple.security.application-groups:
          - group.com.morningvault.app
    dependencies:
      - target: MorningVaultWidget
        embed: true
      - sdk: HealthKit.framework
      - sdk: EventKit.framework
      - sdk: CoreLocation.framework
      - sdk: WeatherKit.framework
      - package: MeetingNotesKit

  MorningVaultWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MorningVaultWidget
      - path: MorningVault/Shared
      # The checklist store in Shared needs the model types.
      - path: MorningVault/Models/Household.swift
      - path: MorningVault/Models/SuggestionRules.swift
      - path: MorningVault/Models/WaterTracker.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeziddr.morningvault.dev.widget
        PRODUCT_NAME: MorningVaultWidget
        INFOPLIST_FILE: MorningVaultWidget/Info.plist
        ALWAYS_SEARCH_USER_PATHS: NO
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 30
        MARKETING_VERSION: 1.0.0
        # Needs App ID com.yeziddr.morningvault.dev.widget (App Groups: group.com.morningvault.app)
        # and an App Store profile with this name, created in the developer portal.
        PROVISIONING_PROFILE_SPECIFIER: "MorningVaultWidgetAppStore"
        SKIP_INSTALL: YES
    entitlements:
      path: MorningVaultWidget/MorningVaultWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.morningvault.app
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  MorningVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MorningVaultTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yeziddr.morningvault.dev.tests
        # This xcodegen build ships without setting presets, so spell the bundle basics out.
        PRODUCT_NAME: MorningVaultTests
        WRAPPER_EXTENSION: xctest
        BUNDLE_LOADER: $(TEST_HOST)
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
        GENERATE_INFOPLIST_FILE: YES
        # Tests run on the simulator only; no distribution profile applies.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - target: MorningVault

schemes:
  MorningVault:
    build:
      targets:
        MorningVault: all
        MorningVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MorningVaultTests
    archive:
      config: Release